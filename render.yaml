# News India - Temporary Free Render Deployment
services:
  - type: web
    name: news-india
    runtime: node
    plan: free
    numInstances: 1
    buildCommand: npm run build
    startCommand: npm run start -w @news-india/api
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATA_PROVIDER
        value: json
      - key: SESSION_SECRET
        generateValue: true
      - key: WEB_ORIGIN
        fromService:
          name: news-india
          type: web
          envVarKey: RENDER_EXTERNAL_URL
